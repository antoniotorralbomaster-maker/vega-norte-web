# Web de AD Vega Norte en el VPS de IONOS, junto a n8n.
# Un contenedor nginx sirve la web en https://DOMINIO/RUTA_WEB/ con usuario y
# contraseña. El Traefik de n8n (otro proyecto de Docker) recibe las visitas y
# las reparte: esta ruta a la web y todo lo demás a n8n, que no se modifica.
# Las variables salen de config.env (lo crea instalar.sh).
name: vega-norte

services:
  web:
    image: nginx:1.27-alpine
    restart: always
    environment:
      - RUTA_WEB=${RUTA_WEB}
    volumes:
      - ${VN_DIR}/sitio:/usr/share/nginx/html${RUTA_WEB}:ro
      - ${VN_DIR}/htpasswd:/etc/nginx/htpasswd:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${RED_TRAEFIK}
      - traefik.http.routers.vega-norte.rule=Host(`${DOMINIO}`) && PathPrefix(`${RUTA_WEB}`)
      - traefik.http.routers.vega-norte.entrypoints=websecure
      - traefik.http.routers.vega-norte.tls=true
      - traefik.http.routers.vega-norte.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.vega-norte.middlewares=vega-norte-cabeceras@docker
      - traefik.http.middlewares.vega-norte-cabeceras.headers.STSSeconds=31536000
      - traefik.http.middlewares.vega-norte-cabeceras.headers.contentTypeNosniff=true
      - traefik.http.middlewares.vega-norte-cabeceras.headers.frameDeny=true
      - traefik.http.services.vega-norte.loadbalancer.server.port=80

networks:
  traefik:
    external: true
    name: ${RED_TRAEFIK}
